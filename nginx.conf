# Served by nginx-unprivileged, so this listens on 8080 (not 80) and
# runs as a non-root uid. Map it to whatever you like on the host.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;

    # ---- Compression -------------------------------------------------
    # The JS bundle is ~163 kB raw / ~52 kB gzipped, so this matters.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/ld+json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- Security headers --------------------------------------------
    # No inline scripts or styles are emitted by the build, so script-src
    # and style-src stay strict. Google Fonts needs two origins: the
    # stylesheet from googleapis, the woff2 files from gstatic.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # HSTS is intentionally omitted: it belongs on the TLS-terminating
    # proxy in front of this container, not here. Setting it on a plain
    # HTTP origin either does nothing or pins a hostname you can't serve
    # over HTTPS yet. Add it at your reverse proxy once certs are live.

    # ---- Caching -----------------------------------------------------
    # Vite fingerprints everything under /assets/, so those are safe to
    # cache indefinitely. A new build produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Static files at the root are NOT fingerprinted (favicon, og-image,
    # profile.webp, resume.pdf) — cache them for a day so a replacement
    # actually shows up without a hard refresh.
    location ~* \.(?:png|svg|webp|jpg|jpeg|gif|ico|pdf|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # index.html must never be cached, or visitors keep booting the old
    # bundle after a deploy. This is the one file that pins the rest.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Container-internal liveness probe. Cheap, unlogged, no filesystem hit.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hide dotfiles from being served if any ever land in the image.
    location ~ /\. {
        deny all;
    }

    # SPA fallback. The site is currently a single route, but this keeps
    # deep links working if a router is added later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
