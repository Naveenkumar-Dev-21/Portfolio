# Generates the contribution "snake" SVG used at the bottom of the profile README.
# Put this at .github/workflows/snake.yml inside the
# Naveenkumar-Dev-21/Naveenkumar-Dev-21 repo.
#
# It commits snake-dark.svg / snake.svg to an "output" branch, which the
# README then references via raw.githubusercontent.com.

name: Generate Snake

on:
  schedule:
    - cron: "17 */12 * * *" # twice a day
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ff41&color_dots=#0d1117,#006d32,#00a338,#00d43c,#00ff41

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
