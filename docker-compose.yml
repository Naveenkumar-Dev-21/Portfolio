# Pull-and-run on the server:
#   docker compose pull && docker compose up -d
#
# Set IMAGE to your Docker Hub repo, in a .env file next to this one or inline:
#   IMAGE=youruser/portfolio:latest docker compose up -d
services:
  portfolio:
    image: ${IMAGE:-naveenkumar/portfolio:latest}
    container_name: portfolio
    restart: unless-stopped

    # Next.js listens on 3000. Put a TLS-terminating reverse proxy
    # (Caddy, Traefik, nginx) in front for the public HTTPS site.
    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1

    # ---- Runtime hardening ------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Cap log growth so a long-running container can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
